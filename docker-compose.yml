# Volume and build paths (./backend, ./frontend, ./docker/...) are relative to this file's directory (repo root).

services:

  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile

    working_dir: /var/www  # Laravel app root inside the container

    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    command: sh -c "composer install && php-fpm"

    depends_on:
      - postgres

    networks:
      - app-network


  nginx:
    image: nginx:alpine

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - app-network


  frontend:
    image: node:22-alpine

    working_dir: /app  # Vue app root inside the container

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "${VITE_PORT}:5173"

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    networks:
      - app-network


  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT}:5432"

    networks:
      - app-network


volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:


networks:
  app-network: