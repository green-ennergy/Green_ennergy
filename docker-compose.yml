# Volume and build paths (./backend, ./frontend, ./docker/...) are relative to this file's directory (repo root).

services:

  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile

    working_dir: /var/www  # Laravel app root inside the container

    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      AI_BACKEND_URL: "http://ai_backend:8001"
      AI_BACKEND_TIMEOUT: "15"
    command: sh -c "composer install && php-fpm"
    depends_on:
      postgres:
        condition: service_healthy
      ai_backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/vendor/autoload.php"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    networks:
      - app-network


  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network


  frontend:
    image: node:22-alpine

    working_dir: /app  # Vue app root inside the container

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${VITE_PORT}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - app-network


  ai_backend:
    build:
      context: ./docker/ai
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./ai_backend:/app
      - ai_venv:/opt/venv
    ports:
      - "${AI_PORT:-8001}:8001"
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      # Called by Laravel only (server-side); keep CORS minimal
      ALLOWED_ORIGINS: "http://localhost:${NGINX_PORT},http://127.0.0.1:${NGINX_PORT}"
      PATH: "/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
    command: >
      sh -c "python -m venv /opt/venv &&
      . /opt/venv/bin/activate &&
      pip install -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - app-network


  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network


volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
  ai_venv:


networks:
  app-network:
