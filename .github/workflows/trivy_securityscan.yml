name: Trivy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  trivy-fs-scan:
    name: Scan dependencies (filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'   # set to '1' later once you've triaged existing findings

      - name: Upload filesystem scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results
          path: trivy-fs-results.json
          retention-days: 30

  trivy-image-scan:
    name: Scan backend & frontend images
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/php/Dockerfile.prod -t green-energy-backend:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'green-energy-backend:scan'
          format: 'json'
          output: 'trivy-backend-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'

      - name: Build frontend image
        run: docker build -f docker/frontend/Dockerfile.prod -t green-energy-frontend:scan frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'green-energy-frontend:scan'
          format: 'json'
          output: 'trivy-frontend-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results
          path: |
            trivy-backend-results.json
            trivy-frontend-results.json
          retention-days: 30
